services:
  web:
    image: ghcr.io/willeduca01/anacake:latest
    build: .
    container_name: anacake
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
